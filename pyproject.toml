[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdgd-light"
version = "0.1.0"
description = "COD agêntico sobre a BDGD da Light (Rio de Janeiro): dados, grafo, gêmeo OpenDSS, MCP e console"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vinicius Aguiar" }]
dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "pyarrow>=15",
    "networkx>=3.2",
    "pandas>=2.1",
    "shapely>=2.0",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
twin = ["opendssdirect.py>=0.9", "bdgd2opendss>=1.2"]
agent = ["mcp>=1.0", "httpx>=0.27", "pydantic>=2"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.5"]

[project.scripts]
bdgd-light = "bdgd_light.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
