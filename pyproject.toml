[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdgd-light"
version = "0.1.0"
description = "COD agêntico sobre a BDGD da Light (Rio de Janeiro): dados, grafo, gêmeo OpenDSS, MCP e console"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vinicius Aguiar" }]
dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "pyarrow>=15",
    "networkx>=3.2",
    "pandas>=2.1",
    "shapely>=2.0",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "pyproj>=3.6",
]

[tool.uv]
# bdgd2opendss 1.2.5 exige pywin32/pypiwin32 em Python 3.12 sem marcador de plataforma; em Linux/macOS
# não há wheel e o `uv sync --extra twin` falha. Só instala no Windows.
override-dependencies = [
    "pywin32; sys_platform == 'win32'",
    "pypiwin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
twin = ["opendssdirect.py>=0.9", "bdgd2opendss>=1.2"]
agent = [
    "mcp>=1.0",
    "httpx>=0.27",
    "pydantic>=2",
    "pyyaml>=6",
]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.5"]
console = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.scripts]
bdgd-light = "bdgd_light.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
