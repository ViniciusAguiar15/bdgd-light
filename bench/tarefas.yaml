# Tarefas do benchmark do agente (issue #36) — 30 tarefas (10 simple / 10 medium / 10 hard) sobre os
# clusters da demo (docs/escopo-cidade.md v3): Tijuca (ALC9925, ALC9946, URG29983, RCP9882), Ipanema
# (PTS0001, PTS9088, PTS9924, PTS4022) e Taquara (TQR0007, TQR33859, TQR33862; regressão).
#
# Campos: id, nivel, cluster, pergunta (ou evento: falta_permanente), falta (trecho injetado antes),
# referencia (ferramentas na ordem esperada), gabarito (ferramenta + argumentos + campo lido do retorno;
# `melhor_opcao` = chaves eletricamente equivalentes à melhor opção de restore_options), verificar
# (resposta numérica | proposta), unidade, tolerancia_rel (padrão 0,02) / tolerancia_abs (padrão 0,5),
# escala (multiplica o gabarito: margem em fração → %), esperado (documental — valor da BDGD 2023 do
# recorte; `bdgd-light bench --gabarito` recalcula e confere).
#
# O acerto numérico aceita qualquer número da resposta final dentro da tolerância (formatos pt-BR).
# Observação da revisão (docs/review/RESULTADOS-OPENAI.md): o resumo deve ser numericamente correto —
# H07 pontua exatamente o caso em que o gpt-4.1-mini citou 1.730 (total do CTMT) no lugar de 479.
versao: 1
tarefas:
  # ---------------------------------------------------------------- simple: uma ferramenta, leitura direta
  - id: S01
    nivel: simple
    cluster: tijuca
    pergunta: "Quantos quilômetros de rede MT tem o alimentador ALC9925?"
    referencia: [get_topology]
    gabarito: {ferramenta: get_topology, argumentos: {ctmt: ALC9925, com_chaves: false}, campo: resumo.km}
    unidade: km
    tolerancia_abs: 0.05
    esperado: 4.246
