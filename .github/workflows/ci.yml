name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Instalar
        run: uv sync --extra dev --extra twin --extra agent
      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Testes
        run: uv run pytest

  console:
    # o console só é publicado pelo pages.yml após o merge; aqui garantimos que compila no PR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Instalar
        run: npm ci
      - name: Build (tsc --noEmit + vite build)
        run: npm run build

  llm-smoke:
    # ADR-003: uma chamada real por provedor (tool calling soma), só quando o segredo existir no
    # repositório (gh secret set OPENAI_API_KEY / GEMINI_API_KEY). Sem segredo, os passos são
    # pulados; falha de provedor (cota, 5xx) não bloqueia o PR (continue-on-error).
    runs-on: ubuntu-latest
    needs: test
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Instalar
        run: uv sync --extra dev --extra agent
      - name: Fake (sempre, sem rede)
        run: uv run bdgd-light llm --provider fake "Quanto é 2 + 3?" --sem-audit
      - name: OpenAI
        if: env.OPENAI_API_KEY != ''
        continue-on-error: true
        run: uv run bdgd-light llm --provider openai "Quanto é 2 + 3?" --sem-audit
      - name: Gemini
        if: env.GEMINI_API_KEY != ''
        continue-on-error: true
        run: uv run bdgd-light llm --provider gemini "Quanto é 2 + 3?" --sem-audit
      - name: Sem segredos
        if: env.OPENAI_API_KEY == '' && env.GEMINI_API_KEY == ''
        run: echo "::notice::llm-smoke pulou os provedores reais — cadastre OPENAI_API_KEY e/ou GEMINI_API_KEY em Settings › Secrets."
