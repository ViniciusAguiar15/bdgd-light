name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Instalar
        run: uv sync --extra dev --extra twin --extra agent
      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Testes
        run: uv run pytest

  console:
    # o console só é publicado pelo pages.yml após o merge; aqui garantimos que compila no PR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Instalar
        run: npm ci
      - name: Build (tsc --noEmit + vite build)
        run: npm run build
